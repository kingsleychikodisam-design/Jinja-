<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jinja Admin Dashboard</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f6f8;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 22px;
}

header span {
  font-size: 13px;
  opacity: .8;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.card h3 {
  font-size: 14px;
  color: #666;
  margin-bottom: 10px;
}

.card strong {
  font-size: 28px;
}

.section {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 25px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.section h2 {
  margin-bottom: 18px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group.full {
  grid-column: 1 / -1;
}

label {
  margin-bottom: 6px;
  font-weight: bold;
  font-size: 14px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.add-btn {
  background: #16a34a;
  color: white;
  margin-top: 15px;
}

.cancel-btn {
  background: #ddd;
  color: #222;
  margin-top: 15px;
  margin-left: 8px;
}

.search {
  margin-bottom: 15px;
}

.products {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.product {
  border: 1px solid #eee;
  border-radius: 10px;
  overflow: hidden;
  background: white;
}

.product img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #eee;
}

.product-info {
  padding: 15px;
}

.product-info h3 {
  margin-bottom: 8px;
}

.price {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.category {
  color: #666;
  font-size: 13px;
  margin-bottom: 12px;
}

.actions {
  display: flex;
  gap: 8px;
}

.edit-btn {
  background: #2563eb;
  color: white;
  flex: 1;
}

.delete-btn {
  background: #dc2626;
  color: white;
  flex: 1;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #777;
}

.preview {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
  margin-top: 10px;
  display: none;
}

@media(max-width: 700px) {

  .dashboard {
    grid-template-columns: 1fr;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .form-group.full {
    grid-column: auto;
  }

  .products {
    grid-template-columns: 1fr;
  }

  header {
    padding: 15px;
  }

  .container {
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Jinja Admin</h1>
  <span>Product Management</span>
</header>

<div class="container">

  <!-- DASHBOARD -->
  <div class="dashboard">

    <div class="card">
      <h3>Total Products</h3>
      <strong id="totalProducts">0</strong>
    </div>

    <div class="card">
      <h3>Categories</h3>
      <strong id="totalCategories">0</strong>
    </div>

    <div class="card">
      <h3>Store Status</h3>
      <strong>Active</strong>
    </div>

  </div>


  <!-- ADD PRODUCT -->
  <div class="section">

    <h2 id="formTitle">Add New Product</h2>

    <form id="productForm">

      <div class="form-grid">

        <div class="form-group">
          <label>Product Name</label>
          <input
            type="text"
            id="productName"
            placeholder="Example: iPhone 15"
            required
          >
        </div>

        <div class="form-group">
          <label>Price (₦)</label>
          <input
            type="number"
            id="productPrice"
            placeholder="Example: 850000"
            required
          >
        </div>

        <div class="form-group">
          <label>Category</label>

          <select id="productCategory" required>
            <option value="">Select category</option>
            <option>Phones</option>
            <option>Laptops</option>
            <option>Accessories</option>
            <option>Electronics</option>
            <option>Tablets</option>
            <option>Other</option>
          </select>

        </div>

        <div class="form-group">
          <label>Product Image</label>

          <input
            type="file"
            id="productImage"
            accept="image/*"
          >

          <img id="imagePreview" class="preview">

        </div>

        <div class="form-group full">
          <label>Product Description</label>

          <textarea
            id="productDescription"
            placeholder="Write details about this product..."
            required
          ></textarea>

        </div>

      </div>

      <button type="submit" class="add-btn" id="submitBtn">
        Add Product
      </button>

      <button
        type="button"
        class="cancel-btn"
        id="cancelBtn"
        style="display:none;"
      >
        Cancel Edit
      </button>

    </form>

  </div>


  <!-- PRODUCT LIST -->
  <div class="section">

    <h2>Products</h2>

    <input
      type="text"
      id="search"
      class="search"
      placeholder="Search products..."
    >

    <div id="products" class="products"></div>

  </div>

</div>


<script>

let products = JSON.parse(
  localStorage.getItem("jinjaProducts")
) || [];

let editingId = null;

const form = document.getElementById("productForm");
const productName = document.getElementById("productName");
const productPrice = document.getElementById("productPrice");
const productCategory = document.getElementById("productCategory");
const productDescription = document.getElementById("productDescription");
const productImage = document.getElementById("productImage");
const imagePreview = document.getElementById("imagePreview");


// SAVE PRODUCTS
function saveProducts() {
  localStorage.setItem(
    "jinjaProducts",
    JSON.stringify(products)
  );
}


// UPDATE DASHBOARD
function updateDashboard() {

  document.getElementById("totalProducts").textContent =
    products.length;

  const categories = [
    ...new Set(products.map(product => product.category))
  ];

  document.getElementById("totalCategories").textContent =
    categories.length;
}


// DISPLAY PRODUCTS
function displayProducts(list = products) {

  const container = document.getElementById("products");

  if (list.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>No products yet</h3>
        <p>Add your first Jinja product above.</p>
      </div>
    `;

    return;
  }

  container.innerHTML = list.map(product => `

    <div class="product">

      <img
        src="${product.image || 'https://via.placeholder.com/500x350?text=Jinja+Product'}"
        alt="${product.name}"
      >

      <div class="product-info">

        <h3>${product.name}</h3>

        <div class="price">
          ₦${Number(product.price).toLocaleString()}
        </div>

        <div class="category">
          ${product.category}
        </div>

        <p>
          ${product.description}
        </p>

        <br>

        <div class="actions">

          <button
            class="edit-btn"
            onclick="editProduct('${product.id}')"
          >
            Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteProduct('${product.id}')"
          >
            Delete
          </button>

        </div>

      </div>

    </div>

  `).join("");
}


// IMAGE PREVIEW
productImage.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    imagePreview.src = e.target.result;
    imagePreview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


// ADD OR EDIT PRODUCT
form.addEventListener("submit", function(e) {

  e.preventDefault();

  const name = productName.value.trim();
  const price = productPrice.value;
  const category = productCategory.value;
  const description = productDescription.value.trim();

  if (!name || !price || !category || !description) {
    alert("Please fill in all required fields.");
    return;
  }


  // EDIT PRODUCT
  if (editingId) {

    const index = products.findIndex(
      product => product.id === editingId
    );

    if (index !== -1) {

      products[index].name = name;
      products[index].price = price;
      products[index].category = category;
      products[index].description = description;

      if (imagePreview.src &&
          imagePreview.style.display !== "none" &&
          imagePreview.style.display !== "") {

        products[index].image = imagePreview.src;

      }

    }

    alert("Product updated successfully!");

  }

  // ADD PRODUCT
  else {

    const product = {
      id: Date.now().toString(),
      name: name,
      price: price,
      category: category,
      description: description,
      image: imagePreview.src || ""
    };

    products.push(product);

    alert("Product added successfully!");

  }


  saveProducts();
  updateDashboard();
  displayProducts();

  form.reset();

  imagePreview.style.display = "none";
  imagePreview.src = "";

  editingId = null;

  document.getElementById("formTitle").textContent =
    "Add New Product";

  document.getElementById("submitBtn").textContent =
    "Add Product";

  document.getElementById("cancelBtn").style.display =
    "none";

});


// EDIT PRODUCT
function editProduct(id) {

  const product = products.find(
    product => product.id === id
  );

  if (!product) return;

  editingId = id;

  productName.value = product.name;
  productPrice.value = product.price;
  productCategory.value = product.category;
  productDescription.value = product.description;

  if (product.image) {

    imagePreview.src = product.image;
    imagePreview.style.display = "block";

  }

  document.getElementById("formTitle").textContent =
    "Edit Product";

  document.getElementById("submitBtn").textContent =
    "Save Changes";

  document.getElementById("cancelBtn").style.display =
    "inline-block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// DELETE PRODUCT
function deleteProduct(id) {

  const product = products.find(
    product => product.id === id
  );

  if (!product) return;

  const confirmDelete = confirm(
    "Delete " + product.name + "?"
  );

  if (!confirmDelete) return;

  products = products.filter(
    product => product.id !== id
  );

  saveProducts();
  updateDashboard();
  displayProducts();

}


// CANCEL EDIT
document.getElementById("cancelBtn")
.addEventListener("click", function() {

  editingId = null;

  form.reset();

  imagePreview.style.display = "none";
  imagePreview.src = "";

  document.getElementById("formTitle").textContent =
    "Add New Product";

  document.getElementById("submitBtn").textContent =
    "Add Product";

  this.style.display = "none";

});


// SEARCH
document.getElementById("search")
.addEventListener("input", function() {

  const searchTerm =
    this.value.toLowerCase();

  const filtered = products.filter(product =>
    product.name.toLowerCase().includes(searchTerm) ||
    product.category.toLowerCase().includes(searchTerm)
  );

  displayProducts(filtered);

});


// START
updateDashboard();
displayProducts();
// ADD PRODUCT SYSTEM
function addProduct() {
  const name = prompt("Product name:");
  if (!name) return;

  const category = prompt("Category (Phones, Laptops, Accessories):");
  if (!category) return;

  const price = prompt("Product price in Naira:");
  if (!price || isNaN(price)) {
    alert("Please enter a valid price.");
    return;
  }

  const vendor = prompt("Company/Vendor name:");
  if (!vendor) return;

  const location = prompt("Vendor location:");
  if (!location) return;

  const icon = prompt("Product icon/emoji (example: 📱):") || "📦";

  let adminProducts = JSON.parse(
    localStorage.getItem("jinjaAdminProducts") || "[]"
  );

  const product = {
    id: Date.now(),
    name: name,
    category: category,
    price: Number(price),
    vendor: vendor,
    location: location,
    icon: icon
  };

  adminProducts.push(product);

  localStorage.setItem(
    "jinjaAdminProducts",
    JSON.stringify(adminProducts)
  );

  alert("Product added successfully!");

  if (typeof displayProducts === "function") {
    displayProducts();
  }

  if (typeof updateDashboard === "function") {
    updateDashboard();
  }
  }
</script>

</body>
  </html>
